apply plugin: 'com.android.application'

android {
    namespace 'com.gt7.bridge.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gt7.bridge.mobile'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '1.6.4-clean-summary'
    }
}

// Correções aplicadas antes da compilação:
// - Resumo organizado no formato pedido.
// - Quebras de linha reais, sem aparecer letra n.
// - Marca, Carro, Pneus/Configuração e Posição vêm dos campos manuais em SETTINGS.
// - Bridge URL e PS5 IP continuam preenchidos com os últimos valores salvos.
tasks.register('patchMainActivityForSessionFix') {
    doLast {
        def f = file('src/main/java/com/gt7/bridge/mobile/MainActivity.java')
        if (f.exists()) {
            def s = f.getText('UTF-8')

            s = s.replace('static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.50:8765";',
                'static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",BR="brand_manual",CFG="config_manual",POSM="position_manual",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.50:8765";')

            s = s.replace('String url,ps5,track,car,lastLap="";',
                'String url,ps5,track,car,brandManual,configManual,posManual,lastLap="";')

            s = s.replace('track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");}',
                'track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");brandManual=s.getString(BR,"--");configManual=s.getString(CFG,"--");posManual=s.getString(POSM,"--");}')

            s = s.replaceAll(/String brand\(\)\{.*?\}String config\(\)\{.*?\}String position\(\)\{.*?\}/,
                'String brand(){return valid(brandManual)&&!brandManual.equals("--")?brandManual:"--";}String config(){return valid(configManual)&&!configManual.equals("--")?configManual:"--";}String position(){return valid(posManual)&&!posManual.equals("--")?posManual:"--";}')

            s = s.replace('String c=val("carName","car","model","modelo");if(!c.equals("--"))car=c;',
                'String c=val("carName","car","model","modelo");')

            s = s.replace('o.put("laps",laps.size());', 'o.put("laps",lapNo().equals("--")?String.valueOf(laps.size()):lapNo());')
            s = s.replace('o.put("finalSpeed",speedT());', 'o.put("finalSpeed",speedT());o.put("bridgeUrl",url);o.put("ps5Ip",ps5);')

            s = s.replace('tv.setTextColor(Color.WHITE);tv.setLineSpacing(4,1.08f);Button copy=new Button(this);',
                'tv.setTextColor(Color.rgb(30,30,30));tv.setLineSpacing(4,1.08f);Button copy=new Button(this);')

            s = s.replace('saveSessionSummary();setActive(false);Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();',
                'calc();saveSessionSummary();setActive(false);resetSession();Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();')

            s = s.replaceAll(/String detailText\(JSONObject o\)\{.*?return sb\.toString\(\);\}/,
                '''String detailText(JSONObject o){StringBuilder sb=new StringBuilder();sb.append("Resumo da Seção\n\n");sb.append("Marca: ").append(o.optString("brand","--")).append('\n');sb.append("Carro: ").append(o.optString("car","--")).append('\n');sb.append("Pneus / Configuração: ").append(o.optString("config","--")).append('\n').append('\n');JSONArray a=o.optJSONArray("lapTimes");if(a!=null&&a.length()>0){for(int i=0;i<a.length();i++)sb.append("Volta ").append(i+1).append(": ").append(a.optString(i,"--")).append('\n');}else{sb.append("Volta 1: --\n");}sb.append('\n');sb.append("Melhor Volta: ").append(o.optString("best","--")).append('\n');sb.append("Tempo Total: ").append(o.optString("total","--")).append('\n');sb.append("Max Session: ").append(o.optString("maxSpeedSession",o.optString("maxSpeed","--"))).append(" km/h");return sb.toString();}''')

            s = s.replace('void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Carro",car);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,206,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}',
                'void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Marca",brandManual);y+=74;setting(c,205,y,"Carro",car);y+=74;setting(c,206,y,"Pneus / Configuração",configManual);y+=74;setting(c,211,y,"Posição",posManual);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,212,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}')

            s = s.replace('else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(CAR,"Nome do carro",car);else if(hit.id==206)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();',
                'else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(BR,"Marca",brandManual);else if(hit.id==205)edit(CAR,"Nome do carro",car);else if(hit.id==206)edit(CFG,"Pneus / Configuração",configManual);else if(hit.id==211)edit(POSM,"Posição",posManual);else if(hit.id==212)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();')

            f.write(s, 'UTF-8')
        }
    }
}

preBuild.dependsOn patchMainActivityForSessionFix

dependencies {
}
