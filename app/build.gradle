apply plugin: 'com.android.application'

android {
    namespace 'com.gt7.bridge.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gt7.bridge.mobile'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '1.6.4-gt7-autocomplete'
    }
}

// Correções aplicadas antes da compilação:
// - Banco interno GT7 para autocomplete de carros, pistas, marcas e pneus/configuração.
// - Resumo no formato pedido com hífen.
// - Botão COPIAR copia o mesmo formato.
// - Quebras de linha seguras com System.lineSeparator().
// - Marca, Carro, Pneus/Configuração e Posição vêm dos campos manuais em SETTINGS.
tasks.register('patchMainActivityForSessionFix') {
    doLast {
        def f = file('src/main/java/com/gt7/bridge/mobile/MainActivity.java')
        if (f.exists()) {
            def s = f.getText('UTF-8')

            s = s.replace('static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.50:8765";',
                'static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",BR="brand_manual",CFG="config_manual",POSM="position_manual",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.50:8765";')

            s = s.replace('String url,ps5,track,car,lastLap="";',
                'String url,ps5,track,car,brandManual,configManual,posManual,lastLap="";')

            s = s.replace('track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");}',
                'track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");brandManual=s.getString(BR,"--");configManual=s.getString(CFG,"--");posManual=s.getString(POSM,"--");}')

            s = s.replaceAll(/String brand\(\)\{.*?\}String config\(\)\{.*?\}String position\(\)\{.*?\}/,
                'String brand(){return valid(brandManual)&&!brandManual.equals("--")?brandManual:"--";}String config(){return valid(configManual)&&!configManual.equals("--")?configManual:"--";}String position(){return valid(posManual)&&!posManual.equals("--")?posManual:"--";}')

            s = s.replace('String c=val("carName","car","model","modelo");if(!c.equals("--"))car=c;',
                'String c=val("carName","car","model","modelo");')

            s = s.replace('o.put("laps",laps.size());', 'o.put("laps",lapNo().equals("--")?String.valueOf(laps.size()):lapNo());')
            s = s.replace('o.put("finalSpeed",speedT());', 'o.put("finalSpeed",speedT());o.put("bridgeUrl",url);o.put("ps5Ip",ps5);')

            s = s.replace('tv.setTextColor(Color.WHITE);tv.setLineSpacing(4,1.08f);Button copy=new Button(this);',
                'tv.setTextColor(Color.rgb(30,30,30));tv.setLineSpacing(4,1.08f);Button copy=new Button(this);')

            s = s.replace('saveSessionSummary();setActive(false);Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();',
                'calc();saveSessionSummary();setActive(false);resetSession();Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();')

            s = s.replaceAll(/String copyText\(JSONObject o\)\{.*?return sb\.toString\(\);\}/,
                'String copyText(JSONObject o){return detailText(o);}')

            s = s.replaceAll(/String detailText\(JSONObject o\)\{.*?return sb\.toString\(\);\}/,
                'String detailText(JSONObject o){String nl=System.lineSeparator();StringBuilder sb=new StringBuilder();sb.append("Resumo da Seção").append(nl).append(nl);sb.append("Marca - ").append(o.optString("brand","--")).append(nl);sb.append("Carro - ").append(o.optString("car","--")).append(nl);sb.append("Pneus / Configuração - ").append(o.optString("config","--")).append(nl).append(nl);JSONArray a=o.optJSONArray("lapTimes");if(a!=null&&a.length()>0){for(int i=0;i<a.length();i++)sb.append("Volta ").append(i+1).append(" - ").append(a.optString(i,"--")).append(nl);}else{sb.append("Volta 1 - --").append(nl);}sb.append(nl);sb.append("Melhor Volta - ").append(o.optString("best","--")).append(nl);sb.append("Tempo Total - ").append(o.optString("total","--")).append(nl);sb.append("Max Session - ").append(o.optString("maxSpeedSession",o.optString("maxSpeed","--"))).append(" km/h");return sb.toString();}')

            s = s.replace('void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Carro",car);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,206,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}',
                'void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Marca",brandManual);y+=74;setting(c,205,y,"Carro",car);y+=74;setting(c,206,y,"Pneus / Configuração",configManual);y+=74;setting(c,211,y,"Posição",posManual);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,212,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}')

            s = s.replace('else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(CAR,"Nome do carro",car);else if(hit.id==206)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();',
                'else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(BR,"Marca",brandManual);else if(hit.id==205)edit(CAR,"Nome do carro",car);else if(hit.id==206)edit(CFG,"Pneus / Configuração",configManual);else if(hit.id==211)edit(POSM,"Posição",posManual);else if(hit.id==212)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();')

            s = s.replace('void edit(final String k,String title,String cur){final EditText in=new EditText(this);in.setSingleLine(true);in.setText(cur);new AlertDialog.Builder(this).setTitle(title).setView(in).setPositiveButton("Salvar",new android.content.DialogInterface.OnClickListener(){public void onClick(android.content.DialogInterface d,int w){String s=in.getText().toString().trim();if(s.length()>0){if(k.equals(URL))s=fix(s);getSharedPreferences(P,0).edit().putString(k,s).apply();load();view.invalidate();}}}).setNegativeButton("Cancelar",null).show();}',
                'void edit(final String k,String title,String cur){final AutoCompleteTextView in=new AutoCompleteTextView(this);in.setSingleLine(true);in.setThreshold(1);in.setText(cur);String[] db=dbFor(k);if(db.length>0)in.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_dropdown_item_1line,db));in.setSelectAllOnFocus(true);new AlertDialog.Builder(this).setTitle(title).setView(in).setPositiveButton("Salvar",new android.content.DialogInterface.OnClickListener(){public void onClick(android.content.DialogInterface d,int w){String s=in.getText().toString().trim();if(s.length()>0){if(k.equals(URL))s=fix(s);getSharedPreferences(P,0).edit().putString(k,s).apply();load();view.invalidate();}}}).setNegativeButton("Cancelar",null).show();in.requestFocus();in.postDelayed(new Runnable(){public void run(){in.showDropDown();}},250);}String[] dbFor(String k){if(k.equals(BR))return dbBrands();if(k.equals(CAR))return dbCars();if(k.equals(TR))return dbTracks();if(k.equals(CFG))return dbConfig();return new String[0];}String[] dbBrands(){return new String[]{"Ferrari","Porsche","Mazda","Nissan","Toyota","Honda","BMW","Mercedes-Benz","Audi","Lexus","Chevrolet","Ford","Subaru","Mitsubishi","Lamborghini","Jaguar","McLaren","Aston Martin","Bugatti","Pagani","Peugeot","Volkswagen","Alfa Romeo","Renault","Hyundai","Dodge","Citroen","Suzuki","KTM","Mini"};}String[] dbConfig(){return new String[]{"Comfort Hard","Comfort Medium","Comfort Soft","Sports Hard","Sports Medium","Sports Soft","Racing Hard","Racing Medium","Racing Soft","Intermediate","Heavy Wet","600 Race","700 Race","800 Race","800 Racing Hard","800 Racing Medium","800 Racing Soft","900 Race","Sardegna 800 Race","Le Mans 700 Race","Tokyo 600 Race","Spa 800 Race"};}String[] dbCars(){return new String[]{"Ferrari F40 \'92","Ferrari F50 \'95","Ferrari LaFerrari \'13","Ferrari 458 Italia Gr.3","Ferrari 458 Italia Gr.4","Porsche 962 C \'88","Porsche 911 RSR \'17","Porsche 911 GT3 RS \'16","Porsche Carrera GT \'04","Mazda 787B \'91","Mazda RX-7 Spirit R Type A \'02","Mazda RX-Vision GT3 Concept","Mazda LM55 Vision Gran Turismo","Nissan R92CP \'92","Nissan GT-R Gr.3","Nissan GT-R Gr.4","Nissan GT-R NISMO \'17","Nissan Skyline GT-R V-spec II Nur \'02","Toyota TS050 Hybrid \'16","Toyota TS030 Hybrid \'12","Toyota GR Supra Racing Concept \'18","Toyota Supra RZ \'97","Honda NSX Gr.3","Honda NSX Gr.4","Honda NSX \'17","BMW Z4 GT3 \'11","BMW M6 GT3 Endurance Model \'16","Mercedes-Benz Sauber Mercedes C9 \'89","Mercedes-AMG GT3 \'16","Mercedes-AMG GT3 \'20","Audi R18 \'16","Audi R18 TDI \'11","Audi R8 LMS Evo \'19","Chevrolet Corvette C7 Gr.3","Chevrolet Corvette C7 Gr.4","Chevrolet Corvette C8 \'20","Ford GT \'17","Ford Mustang Gr.3","Ford Mustang Gr.4","Jaguar XJR-9 \'88","Jaguar F-Type Gr.3","Jaguar F-Type Gr.4","Lamborghini Veneno \'14","Lamborghini Huracan GT3 \'15","Lamborghini Huracan Gr.4","McLaren F1 \'94","McLaren 650S Gr.4","Peugeot 908 HDi FAP \'10","Peugeot RCZ Gr.3","Peugeot RCZ Gr.4","Subaru WRX Gr.3","Subaru WRX Gr.4","Mitsubishi Lancer Evolution Final Gr.3","Mitsubishi Lancer Evolution Final Gr.4","Lexus LF-LC GT Vision Gran Turismo","Lexus RC F GT3 \'17","Volkswagen Beetle Gr.3","Dodge SRT Tomahawk X Vision Gran Turismo","Dodge SRT Tomahawk GTS-R Vision Gran Turismo","Gran Turismo Red Bull X2019 Competition"};}String[] dbTracks(){return new String[]{"Circuit de la Sarthe","Circuit de la Sarthe No Chicane","Circuit de Spa-Francorchamps","Circuit de Spa-Francorchamps 24h Layout","Nurburgring Nordschleife","Nurburgring 24h","Nurburgring GP","Nurburgring Sprint","Sardegna - Road Track - A","Sardegna - Road Track - A Reverse","Sardegna - Road Track - B","Sardegna - Road Track - B Reverse","Sardegna - Road Track - C","Sardegna - Road Track - C Reverse","Tokyo Expressway - East Clockwise","Tokyo Expressway - East Counterclockwise","Tokyo Expressway - Central Clockwise","Tokyo Expressway - Central Counterclockwise","Tokyo Expressway - South Clockwise","Tokyo Expressway - South Counterclockwise","Monza Circuit","Monza Circuit No Chicane","Suzuka Circuit","Suzuka Circuit East Course","Fuji International Speedway","Fuji International Speedway Short Course","Daytona International Speedway","Daytona Road Course","Watkins Glen International Long Course","Watkins Glen International Short Course","Michelin Raceway Road Atlanta","WeatherTech Raceway Laguna Seca","Mount Panorama Motor Racing Circuit","Trial Mountain Circuit","Trial Mountain Circuit Reverse","Deep Forest Raceway","Deep Forest Raceway Reverse","Grand Valley - Highway 1","Grand Valley - Highway 1 Reverse","High Speed Ring","High Speed Ring Reverse","Autopolis International Racing Course","Autopolis International Racing Course - Shortcut Course","Brands Hatch Grand Prix Circuit","Brands Hatch Indy Circuit","Dragon Trail - Seaside","Dragon Trail - Seaside Reverse","Dragon Trail - Gardens","Dragon Trail - Gardens Reverse","Autodrome Lago Maggiore - Full Course","Autodrome Lago Maggiore - Center","Autodrome Lago Maggiore - East","Autodrome Lago Maggiore - West","Red Bull Ring","Red Bull Ring Short Track","Tsukuba Circuit","Goodwood Motor Circuit","Willow Springs International Raceway - Big Willow","Willow Springs International Raceway - Streets of Willow Springs","Willow Springs International Raceway - Horse Thief Mile","Kyoto Driving Park - Yamagiwa","Kyoto Driving Park - Miyabi","Kyoto Driving Park - Yamagiwa + Miyabi","Special Stage Route X"};}')

            f.write(s, 'UTF-8')
        }
    }
}

preBuild.dependsOn patchMainActivityForSessionFix

dependencies {
}
