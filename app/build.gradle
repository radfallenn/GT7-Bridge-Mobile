apply plugin: 'com.android.application'

android {
    namespace 'com.gt7.bridge.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gt7.bridge.mobile'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '1.6.4-summary-defaults'
    }
}

tasks.register('patchMainActivityForSessionFix') {
    doLast {
        def f = file('src/main/java/com/gt7/bridge/mobile/MainActivity.java')
        if (f.exists()) {
            def s = f.getText('UTF-8')
            s = s.replace('http://192.168.1.50:8765', 'http://192.168.1.70:8787')
            s = s.replace('s.getString(PS5,"192.168.1.23")', 's.getString(PS5,"192.168.1.54")')
            s = s.replace('static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.70:8787";', 'static final String VER="v1.6.4",P="gt7_v164",URL="url",PS5="ps5",TR="track",CAR="car",BR="brand_manual",CFG="config_manual",POSM="position_manual",SES="sessions",TH="theme",ACT="active",DEF="http://192.168.1.70:8787";')
            s = s.replace('String url,ps5,track,car,lastLap="";', 'String url,ps5,track,car,brandManual,configManual,posManual,lastLap="";')
            s = s.replace('track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");}', 'track=s.getString(TR,"TRACK");car=s.getString(CAR,"GT7 CAR");brandManual=s.getString(BR,"--");configManual=s.getString(CFG,"--");posManual=s.getString(POSM,"--");}')
            s = s.replaceAll(/String brand\(\)\{.*?\}String config\(\)\{.*?\}String position\(\)\{.*?\}/, 'String brand(){return valid(brandManual)&&!brandManual.equals("--")?brandManual:"--";}String config(){return valid(configManual)&&!configManual.equals("--")?configManual:"--";}String position(){return valid(posManual)&&!posManual.equals("--")?posManual:"--";}')
            s = s.replace('String c=val("carName","car","model","modelo");if(!c.equals("--"))car=c;', 'String c=val("carName","car","model","modelo");')
            s = s.replace('o.put("laps",laps.size());', 'o.put("laps",lapNo().equals("--")?String.valueOf(laps.size()):lapNo());')
            s = s.replace('o.put("finalSpeed",speedT());', 'o.put("finalSpeed",speedT());o.put("bridgeUrl",url);o.put("ps5Ip",ps5);')
            s = s.replace('tv.setTextColor(Color.WHITE);tv.setLineSpacing(4,1.08f);Button copy=new Button(this);', 'tv.setTextColor(Color.rgb(30,30,30));tv.setLineSpacing(4,1.08f);Button copy=new Button(this);')
            s = s.replace('saveSessionSummary();setActive(false);Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();', 'calc();saveSessionSummary();setActive(false);resetSession();Toast.makeText(this,"Secao finalizada e salva",0).show();view.invalidate();')
            s = s.replaceAll(/String copyText\(JSONObject o\)\{.*?return sb\.toString\(\);\}/, 'String copyText(JSONObject o){return detailText(o);}')
            s = s.replaceAll(/String detailText\(JSONObject o\)\{.*?return sb\.toString\(\);\}/, 'String detailText(JSONObject o){String nl=System.lineSeparator();StringBuilder sb=new StringBuilder();sb.append("Resumo da Seção").append(nl).append(nl);sb.append("Marca - ").append(o.optString("brand","--")).append(nl).append(nl);sb.append("Carro - ").append(o.optString("car","--")).append(nl).append(nl);sb.append("Pneus / Configuração - ").append(o.optString("config","--")).append(nl).append(nl);JSONArray a=o.optJSONArray("lapTimes");if(a!=null&&a.length()>0){for(int i=0;i<a.length();i++)sb.append("Volta ").append(i+1).append(" - ").append(a.optString(i,"--")).append(nl);}else{sb.append("Volta 1 - --").append(nl);}sb.append(nl);sb.append("Melhor Volta - ").append(o.optString("best","--")).append(nl);sb.append("Tempo Total - ").append(o.optString("total","--")).append(nl);sb.append("Max Session - ").append(o.optString("maxSpeedSession",o.optString("maxSpeed","--"))).append(" km/h");return sb.toString();}')
            s = s.replace('void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Carro",car);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,206,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}', 'void settings(Canvas c){float y=66;setting(c,201,y,"Bridge URL",url);y+=74;setting(c,202,y,"PS5 IP",ps5);y+=74;setting(c,203,y,"Pista",track);y+=74;setting(c,204,y,"Marca",brandManual);y+=74;setting(c,205,y,"Carro",car);y+=74;setting(c,206,y,"Pneus / Configuração",configManual);y+=74;setting(c,211,y,"Posição",posManual);y+=74;button(c,208,8,y,414,60,"TEMA",themeName()+" · toque para trocar",theme()==1?gold:cyan);y+=74;button(c,212,8,y,414,60,"RESTAURAR CARDS","liga todos os checks",cyan);y+=74;button(c,207,8,y,414,60,"APAGAR SESSOES","limpar historico salvo",red);}')
            s = s.replace('else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(CAR,"Nome do carro",car);else if(hit.id==206)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();', 'else if(hit.id==203)edit(TR,"Nome da pista",track);else if(hit.id==204)edit(BR,"Marca",brandManual);else if(hit.id==205)edit(CAR,"Nome do carro",car);else if(hit.id==206)edit(CFG,"Pneus / Configuração",configManual);else if(hit.id==211)edit(POSM,"Posição",posManual);else if(hit.id==212)reset();else if(hit.id==207)clear();else if(hit.id==208)toggleTheme();invalidate();')
            s = s.replace('void edit(final String k,String title,String cur){final EditText in=new EditText(this);in.setSingleLine(true);in.setText(cur);new AlertDialog.Builder(this).setTitle(title).setView(in).setPositiveButton("Salvar",new android.content.DialogInterface.OnClickListener(){public void onClick(android.content.DialogInterface d,int w){String s=in.getText().toString().trim();if(s.length()>0){if(k.equals(URL))s=fix(s);getSharedPreferences(P,0).edit().putString(k,s).apply();load();view.invalidate();}}}).setNegativeButton("Cancelar",null).show();}', 'void edit(final String k,String title,String cur){final AutoCompleteTextView in=new AutoCompleteTextView(this);in.setSingleLine(true);in.setThreshold(1);in.setText(cur);String[] db=dbFor(k);if(db.length>0)in.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_dropdown_item_1line,db));in.setSelectAllOnFocus(true);new AlertDialog.Builder(this).setTitle(title).setView(in).setPositiveButton("Salvar",new android.content.DialogInterface.OnClickListener(){public void onClick(android.content.DialogInterface d,int w){String s=in.getText().toString().trim();if(s.length()>0){if(k.equals(URL))s=fix(s);getSharedPreferences(P,0).edit().putString(k,s).apply();load();view.invalidate();}}}).setNegativeButton("Cancelar",null).show();in.requestFocus();in.postDelayed(new Runnable(){public void run(){in.showDropDown();}},250);}String[] dbFor(String k){if(k.equals(BR))return new String[]{"Ferrari","Porsche","Mazda","Nissan","Toyota","Honda","BMW","Mercedes-Benz","Audi","Chevrolet","Ford","Lamborghini","Jaguar","McLaren","Subaru"};if(k.equals(CFG))return new String[]{"Comfort Hard","Comfort Medium","Comfort Soft","Sports Hard","Sports Medium","Sports Soft","Racing Hard","Racing Medium","Racing Soft","Intermediate","Heavy Wet","800 Race","700 Race","900 Race"};if(k.equals(CAR))return new String[]{"Ferrari F40 \'92","Mazda 787B \'91","Porsche 962 C \'88","Nissan R92CP \'92","Mercedes-Benz Sauber Mercedes C9 \'89","Jaguar XJR-9 \'88","Toyota TS050 Hybrid \'16","Chevrolet Corvette C7 Gr.3","Honda NSX Gr.3","BMW Z4 GT3 \'11","Dodge SRT Tomahawk X Vision Gran Turismo"};if(k.equals(TR))return new String[]{"Circuit de la Sarthe","Circuit de Spa-Francorchamps","Nurburgring Nordschleife","Sardegna - Road Track - A","Tokyo Expressway - East Clockwise","Monza Circuit","Suzuka Circuit","Fuji International Speedway","Daytona Road Course","Watkins Glen International Long Course","WeatherTech Raceway Laguna Seca","Trial Mountain Circuit","Deep Forest Raceway"};return new String[0];}')
            f.write(s, 'UTF-8')
        }
    }
}

preBuild.dependsOn patchMainActivityForSessionFix

dependencies {
}
