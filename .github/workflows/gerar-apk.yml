name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'android/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/gerar-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Corrigir Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type bin --no-daemon
          chmod +x ./gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null
          ./gradlew --version --no-daemon

      - name: Gerar APK Debug
        run: ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GT7-Bridge-Mobile-v161.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Mobile-APK-v161
          path: dist/GT7-Bridge-Mobile-v161.apk
          if-no-files-found: error
