name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Remover abas extras
        run: |
          perl -0777 -i -pe 's/\s*shell\.addView\(tabs\(\)\);//' app/src/main/java/com/gt7/bridge/mobile/MainActivity.java

      - name: Remover Volta Alvo
        run: |
          perl -0777 -i -pe 's/grid2\(card\("VOLTAS CORRIGIDAS", "voltasCorrigidas", BLUE\), targetCard\(\)\)/grid2(card("VOLTAS CORRIGIDAS", "voltasCorrigidas", BLUE), card("ESTADO DA CORRIDA", "estadoCorrida", BLUE))/g' app/src/main/java/com/gt7/bridge/mobile/MainActivity.java
          perl -0777 -i -pe 's/wrap\.addView\(grid2\(card\("ESTADO DA CORRIDA", "estadoCorrida", BLUE\), card\("PARADAS BOXES", "paradasBoxes", TXT\)\)\);/wrap.addView(grid2(card("PARADAS BOXES", "paradasBoxes", TXT), card("VELOCIDADE MÁXIMA", "velocidadeMaxima", YELLOW)));/g' app/src/main/java/com/gt7/bridge/mobile/MainActivity.java

      - name: Gerar APK Debug
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GT7-Bridge-Mobile-v156.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Mobile-APK
          path: dist/GT7-Bridge-Mobile-v156.apk
          if-no-files-found: error
