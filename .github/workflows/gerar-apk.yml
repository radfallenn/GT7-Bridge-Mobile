name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle automaticamente
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Conferir arquivos do projeto
        run: |
          echo "Raiz do repositório:"
          ls -la
          echo "Pasta app:"
          ls -la app
          echo "MainActivity:"
          ls -la app/src/main/java/com/gt7/bridge/mobile/MainActivity.java

      - name: Gerar APK Debug
        run: gradle clean :app:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK para download
        run: |
          mkdir -p dist
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | sed "s/versionName '//;s/'//")
          cp app/build/outputs/apk/debug/app-debug.apk "dist/GT7-Bridge-Mobile-v${VERSION_NAME}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Mobile-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
