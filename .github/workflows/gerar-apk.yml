name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Gerar APK Debug
        run: gradle :app:assembleDebug
      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Mobile-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
