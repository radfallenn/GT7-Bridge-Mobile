name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/gerar-apk.yml'

permissions:
  contents: read

env:
  APK_NAME: GT7-Bridge-Mobile

jobs:
  build-apk:
    name: Gerar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Conferir estrutura do projeto
        run: |
          echo "Arquivos da raiz:"
          ls -la
          echo "Arquivos do app:"
          ls -la app
          echo "MainActivity:"
          ls -la app/src/main/java/com/gt7/bridge/mobile/MainActivity.java

      - name: Limpar build anterior
        run: gradle clean --no-daemon

      - name: Gerar APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: |
          VERSION_NAME=$(grep -o "versionName '[^']*'" app/build.gradle | sed "s/versionName '//;s/'//")
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}-v${VERSION_NAME}.apk"
          ls -la dist

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: GT7-Bridge-Mobile-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
