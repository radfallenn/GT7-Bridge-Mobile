name: Aplicar recovery conexão v1.4.8

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-connection-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar patch de conexão
        run: node scripts/apply-connection-recovery-v1.4.8.mjs

      - name: Atualizar versão Gradle para 1.4.8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("versionCode 11", "versionCode 12")
          s = s.replace("versionName '1.4.7'", "versionName '1.4.8'")
          p.write_text(s)
          PY

      - name: Mostrar diff
        run: git diff -- app/src/main/java/com/gt7/bridge/mobile/MainActivity.java app/build.gradle

      - name: Commitar alterações
        run: |
          if git diff --quiet -- app/src/main/java/com/gt7/bridge/mobile/MainActivity.java app/build.gradle; then
            echo "Nenhuma alteração necessária."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/gt7/bridge/mobile/MainActivity.java app/build.gradle
            git commit -m "Recuperar conexão UDP mantendo layout moderno"
            git push
          fi
