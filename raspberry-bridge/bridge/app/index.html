<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GT7 rAd Telemetry</title><style>:root{--line:#1c2a3d;--text:#eef6ff;--muted:#8da1b8;--ok:#00e58a;--bad:#ff405b;--warn:#ffc247}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172235,#080b12 55%);font-family:Arial,Helvetica,sans-serif;color:var(--text)}main{max-width:520px;margin:auto;min-height:100vh;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900}.status{font-size:12px;padding:8px 10px;border-radius:999px;background:#1b2330;color:var(--muted)}.status.ok{color:#001b10;background:var(--ok)}.status.bad{color:white;background:var(--bad)}.tach{height:220px;border-radius:28px;background:linear-gradient(160deg,#121b2a,#090d15);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 18px 50px #0008}.rpm{font-size:54px;font-weight:900}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}.speed{font-size:34px;font-weight:900;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#121a27,#0c111a);border-radius:18px;padding:14px;min-height:86px}.card .v{font-size:25px;font-weight:900;margin-top:8px}.wide{grid-column:span 2}.bar{height:9px;border-radius:999px;background:#233045;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));transition:.12s}.footer{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.5}.raw{white-space:pre-wrap;max-height:160px;overflow:auto;background:#05070b;border:1px solid var(--line);border-radius:14px;padding:10px;color:#9db3cc}</style></head><body><main><div class="top"><div class="brand">GT7 rAd Telemetry</div><div id="status" class="status bad">OFFLINE</div></div><section class="tach"><div><div class="label">RPM</div><div id="rpm" class="rpm">0</div><div id="speed" class="speed">0 km/h</div></div></section><section class="grid"><div class="card"><div class="label">Marcha</div><div id="gear" class="v">N</div></div><div class="card"><div class="label">Pacotes</div><div id="packets" class="v">0</div></div><div class="card"><div class="label">Acelerador</div><div id="throttle" class="v">0%</div><div class="bar"><div id="throttleBar" class="fill"></div></div></div><div class="card"><div class="label">Freio</div><div id="brake" class="v">0%</div><div class="bar"><div id="brakeBar" class="fill"></div></div></div><div class="card"><div class="label">Combustível</div><div id="fuel" class="v">0%</div></div><div class="card"><div class="label">Volta</div><div id="lap" class="v">0</div></div><div class="card"><div class="label">Última</div><div id="last" class="v">--:--.---</div></div><div class="card"><div class="label">Melhor</div><div id="best" class="v">--:--.---</div></div><div class="card wide"><div class="label">RAW / Diagnóstico</div><div id="raw" class="raw">Aguardando dados...</div></div></section><div class="footer">Abra este endereço no celular: http://IP_DO_RASPBERRY:8787</div></main><script>const $=id=>document.getElementById(id);function set(data){const ok=!!data.connected&&Number(data.age_ms||0)<2000;$('status').textContent=ok?'ONLINE':'OFFLINE';$('status').className='status '+(ok?'ok':'bad');$('rpm').textContent=Math.round(data.rpm||0);$('speed').textContent=(data.speed_kmh||0).toFixed(1)+' km/h';$('gear').textContent=data.gear||'N';$('packets').textContent=data.packet_count||0;$('throttle').textContent=(data.throttle||0)+'%';$('brake').textContent=(data.brake||0)+'%';$('throttleBar').style.width=(data.throttle||0)+'%';$('brakeBar').style.width=(data.brake||0)+'%';$('fuel').textContent=(data.fuel_percent||0)+'%';$('lap').textContent=data.current_lap||0;$('last').textContent=data.last_lap_time||'--:--.---';$('best').textContent=data.best_lap_time||'--:--.---';$('raw').textContent=JSON.stringify({magic:data.magic,source:data.source_ip,bytes:data.packet_bytes,age_ms:data.age_ms,raw_probe:data.raw_probe},null,2)}function connect(){const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(proto+'://'+location.host+'/ws');ws.onmessage=e=>set(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1200)}connect();setInterval(()=>fetch('/api/live').then(r=>r.json()).then(set).catch(()=>{}),1500)</script></body></html>
